version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: saturday
      time: '09:00'
      timezone: 'Europe/Madrid'
    open-pull-requests-limit: 10
    groups:
      fontawesome:
        patterns:
          - '@fortawesome/*'
      coding-style:
        patterns:
          - '@shlinkio/eslint-config-js-coding-standard'
          - 'oxfmt'
          - 'oxlint'
          - 'oxlint-tsgolint'
      shlink:
        patterns:
          - '@shlinkio/*'
      react-router:
        patterns:
          - 'react-router'
          - '@react-router/*'
      remix-auth:
        patterns:
          - 'remix-auth*'
      orm:
        patterns:
          - '@mikro-orm/*'
          - 'libsql'
          - 'better-sqlite3'
      react:
        patterns:
          - 'react'
          - 'react-dom'
      types:
        patterns:
          - '@types/*'
      testing:
        patterns:
          - '@testing-library/*'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      tailwindcss:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: saturday
      time: '09:00'
      timezone: 'Europe/Madrid'
